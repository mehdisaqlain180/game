  <title>Stealth Ninja</title>
  <style>:root{--bg-base:#070b12;--bg-surface:#0f172a;--bg-elevated:#162033;--border-hairline:#94a3b829;--border-strong:#38bdf859;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--accent-cyan:#22d3ee;--accent-emerald:#10b981;--accent-amber:#f59e0b;--accent-red:#ef4444;--font-sans:"Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;--font-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace}*{box-sizing:border-box;-webkit-user-select:none;user-select:none;margin:0;padding:0}html,body{background-color:var(--bg-base);width:100%;height:100%;color:var(--text-primary);font-family:var(--font-sans);touch-action:none;overflow:hidden}#app{background:var(--bg-base);width:100%;height:100%;position:relative;overflow:hidden}canvas#gameCanvas{cursor:crosshair;width:100%;height:100%;display:block}.tabular{font-family:var(--font-mono);font-variant-numeric:tabular-nums}#hud{pointer-events:none;z-index:10;background:linear-gradient(#070b12b8 0%,#070b1200 100%);justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;display:flex;position:absolute;inset:0 0 auto}.hud-cluster{pointer-events:auto;align-items:center;gap:12px;display:flex}.hud-center{pointer-events:none;color:var(--text-primary);text-shadow:0 1px 4px #000c;align-items:center;gap:8px;font-size:13px;font-weight:600;display:flex}.hud-objective{color:var(--accent-cyan);font-size:13px;font-weight:600}.hud-objective.ready{color:var(--accent-emerald)}.stat-group{align-items:center;gap:6px;display:flex}.hearts-row{align-items:center;gap:4px;display:flex}.heart-icon{width:16px;height:16px;transition:transform .15s,opacity .15s}.heart-icon.empty{opacity:.25;transform:scale(.88)}.shuriken-row{align-items:center;gap:4px;display:flex}.shuriken-pip{width:15px;height:15px;transition:opacity .15s,transform .15s}.shuriken-pip.spent{opacity:.2;transform:scale(.85)}.dash-meter{align-items:center;gap:6px;display:flex}.dash-track{background:#94a3b833;border-radius:999px;width:48px;he p:10px 20px;margin:20px 0 24px;padding:16px 0;display:grid}.control-row{color:var(--text-secondary);justify-content:space-between;align-items:center;gap:12px;font-size:13px;display:flex}.control-key{font-family:var(--font-mono);color:var(--text-primary);background:var(--bg-elevated);border:1px solid var(--border-hairline);white-space:nowrap;border-radius:5px;padding:3px 8px;font-size:12px;font-weight:600}.btn-row{flex-wrap:wrap;align-items:center;gap:12px;display:flex}.btn{appearance:none;border:1px solid var(--border-hairline);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;font-weight:600;font-family:var(--font-sans);cursor:pointer;white-space:nowrap;border-radius:8px;padding:11px 22px;transition:background-color .15s,border-color .15s,transform .1s,opacity .15s}.btn:hover:not(:disabled){background:#1e293b;border-color:#94a3b859}.btn:active:not(:disabled){transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-primary{background:var(--accent-cyan);border-color:var(--accent-cyan);color:#04121a}.btn-primary:hover:not(:disabled){background:#38bdf8;border-color:#38bdf8}.btn-danger{color:#fca5a5;background:#ef444426;border-color:#ef444466}.btn-danger:hover:not(:disabled){background:#ef444440}.panel-top{justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;display:flex}.panel-title{color:var(--text-primary);font-size:22px;font-weight:700}.level-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;display:grid}.level-card{text-align:left;background:var(--bg-elevated);border:1px solid var(--border-hairline);cursor:pointer;color:var(--text-primary);border-radius:10px;flex-direction:column;gap:8px;padding:16px;transition:border-color .15s,background-color .15s,transform .1s;display:flex}.level-card:hover:not(:disabled){border-color:var(--border-strong);background:#1b283f;transform:translateY(-1px)}.level-card:disabled{opacity:.48;cursor:not-allowed}.level-card-head{color:var(--text-secondary);justify-content:space-between;align-items:center;gap:8px;font-size:12px;display:flex}.level-card-name{color:var(--text-primary);font-size:15px;font-weight:600}.level-card-desc{color:var(--text-secondary);flex:1;font-size:12px;line-height:1.45}.level-card-meta{border-top:1px solid var(--border-hairline);color:var(--text-secondary);justify-content:space-between;align-items:center;gap:8px;padding-top:8px;font-size:12px;display:flex}.stars{color:var(--accent-amber);gap:2px;font-size:14px;display:inline-flex}.star-dim{color:#94a3b840}.result-stars{align-items:center;gap:8px;margin:14px 0 18px;display:flex}.result-star{width:32px;height:32px;color:var(--accent-amber)}.result-star.unearned{color:#94a3b838}.summary-grid{border-top:1px solid var(--border-hairline);border-bottom:1px solid var(--border-hairline);grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin-bottom:22px;padding:16px 0;display:grid}.summary-item{flex-direction:column;gap:3px;display:flex}.summary-label{color:var(--text-secondary);font-size:12px}.summary-value{color:var(--text-primary);font-size:18px;font-weight:700}.summary-value.good{color:var(--accent-emerald)}.summary-value.warn{color:var(--accent-amber)}#touchControls{z-index:12;pointer-events:auto;gap:12px;display:none;position:absolute;bottom:20px;right:20px}.touch-btn{border:1px solid var(--border-strong);width:64px;height:64px;color:var(--text-primary);cursor:pointer;background:#0f172ad9;border-radius:50%;flex-direction:column;justify-content:center;align-items:center;gap:2px;font-size:12px;font-weight:700;display:flex}.touch-btn:active{background:#22d3ee40}@media (hover:none) and (pointer:coarse){#touchControls.active{display:flex}}@media (width<=760px){#hud{flex-wrap:wrap;gap:6px;padding:10px 12px}.hud-center{order:3;justify-content:center;width:100%}.level-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:20px}}@media (width<=500px){.level-grid{grid-template-columns:1fr}}</style>
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas" aria-label="Stealth Ninja game arena"></canvas>

    <!-- Minimal HUD -->
    <div id="hud" class="hidden">
      <div class="hud-cluster">
        <div id="hudHearts" class="hearts-row" title="Health"></div>
        <div id="hudShurikens" class="shuriken-row" title="Shurikens (E / Right-Click)"></div>
        <div class="dash-track" title="Shadow Step (Space / Shift)">
          <div id="hudDashFill" class="dash-fill"></div>
        </div>
        <span id="hudKeycardGroup" class="keycard-badge hidden" title="Keycard Collected">Key</span>
      </div>

      <div class="hud-center">
        <span id="hudLevelTitle">Lvl 1</span>
        <span style="color:var(--text-muted)">·</span>
        <span id="hudObjective" class="hud-objective tabular">3 left</span>
      </div>

      <div class="hud-cluster">
        <div class="score-block">
          <span id="hudCombo" class="combo-value tabular hidden">2x</span>
          <span id="hudScore" class="score-value tabular">0</span>
        </div>
        <button id="btnRestartHud" class="icon-btn" type="button" title="Restart (R)" aria-label="Restart">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button id="btnMuteHud" class="icon-btn" type="button" title="Sound (M)" aria-label="Toggle Sound"></button>
        <button id="btnPauseHud" class="icon-btn" type="button" title="Pause (Esc)" aria-label="Pause">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile Touch Action Buttons -->
    <div id="touchControls">
      <button id="btnTouchShuriken" class="touch-btn" type="button">Throw<span class="tabular" id="touchShurikenCount">3</span></button>
      <button id="btnTouchDash" class="touch-btn" type="button">Step</button>
    </div>

    <!-- Simple Title Menu -->
    <div id="titleScreen" class="overlay">
      <div class="panel" style="max-width:440px;text-align:center;">
        <h1 class="title-heading" style="margin-bottom:20px;">STEALTH NINJA</h1>

        <div class="btn-row" style="justify-content:center;flex-wrap:nowrap;">
          <button id="btnPlay" class="btn btn-primary" type="button">Play</button>
          <button id="btnLevelSelect" class="btn" type="button">Levels</button>
          <button id="btnEndlessTitle" class="btn hidden" type="button">Endless</button>
          <button id="btnMuteTitle" class="btn" type="button">Sound</button>
        </div>

        <p style="margin-top:18px;font-size:12px;color:var(--text-secondary);">
          WASD / Click move · Space dash · E / Right-click shuriken
        </p>
      </div>
    </div>

    <!-- Level Select Screen -->
    <div id="levelSelectScreen" class="overlay hidden">
      <div class="panel panel-wide" style="max-width:660px;">
        <div class="panel-top" style="margin-bottom:16px;">
          <h2 class="panel-title">Levels</h2>
          <button id="btnBackToTitle" class="btn" type="button">Back</button>
        </div>
        <div id="levelGrid" class="level-grid"></div>
      </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pauseScreen" class="overlay hidden">
      <div class="panel" style="max-width:420px;">
        <h2 class="panel-title" style="margin-bottom:8px;">Paused</h2>
        <p id="pauseMeta" style="font-size:13px;color:var(--text-secondary);margin-bottom:22px;">Level 1 · Silent Corridor</p>
        <div class="btn-row" style="flex-direction:column;align-items:stretch;">
          <button id="btnResume" class="btn btn-primary" type="button">Resume</button>
          <button id="btnPauseRestart" class="btn" type="button">Restart Level</button>
          <button id="btnPauseMute" class="btn" type="button">Sound: On</button>
          <button id="btnPauseLevels" class="btn" type="button">Level Select</button>
          <button id="btnPauseTitle" class="btn" type="button">Title Screen</button>
        </div>
      </div>
    </div>

    <!-- Result / Game Over Overlay -->
    <div id="resultScreen" class="overlay hidden">
      <div class="panel" style="max-width:480px;">
        <div id="resultKicker" class="title-kicker">Mission Complete</div>
        <h2 id="resultHeading" class="panel-title" style="font-size:26px;">Extraction Successful</h2>
        <div id="resultStars" class="result-stars"></div>

        <div class="summary-grid">
          <div class="summary-item">
            <span class="summary-label">Final Score</span>
            <span id="resScore" class="summary-value tabular">0</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Clear Time</span>
            <span id="resTime" class="summary-value tabular">0.0s</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Stealth Rating</span>
            <span id="resStealth" class="summary-value good">Undetected</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Best Score</span>
            <span id="resBest" class="summary-value tabular">0</span>
          </div>
        </div>

        <div class="btn-row">
          <button id="btnResultPrimary" class="btn btn-primary" type="button">Next Level</button>
          <button id="btnResultReplay" class="btn" type="button">Replay</button>
          <button id="btnResultLevels" class="btn" type="button">Level Select</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      // =========================================================================
      // CONSTANTS & LOCAL STORAGE PERSISTENCE
      // =========================================================================
      const TILE = 48;
      const STORAGE_KEY = "stealth_ninja_save_v1";

      const DEFAULT_SAVE = {
        unlockedLevel: 1,
        endlessUnlocked: false,
        muted: false,
        levels: {},
        endlessBestScore: 0,
        endlessBestFloor: 0
      };

      function loadSave() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return structuredClone(DEFAULT_SAVE);
          const parsed = JSON.parse(raw);
          return {
            ...structuredClone(DEFAULT_SAVE),
            ...parsed,
            levels: { ...(parsed.levels || {}) }
          };
        } catch {
          return structuredClone(DEFAULT_SAVE);
        }
      }

      function persistSave() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
        } catch {
          // Ignore storage quota errors
        }
      }

      const saveData = loadSave();

      // =========================================================================
      // WEB AUDIO SYNTHESIZER (ZERO EXTERNAL ASSETS)
      // =========================================================================
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = !!saveData.muted;
          this.lastLaserHum = 0;
        }

        ensureContext() {
          if (this.muted) return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            this.ctx = new AudioCtx();
          }
          if (this.ctx.state === "suspended") {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        }

        toggleMute() {
          this.muted = !this.muted;
          saveData.muted = this.muted;
          persistSave();
          updateMuteButtons();
        }

        playNoise(duration, filterFreq, gainVal, q = 1) {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const sampleRate = ctx.sampleRate;
          const length = Math.max(1, Math.floor(sampleRate * duration));
          const buffer = ctx.createBuffer(1, length, sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / length);
          }
          const src = ctx.createBufferSource();
          src.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = "bandpass";
          filter.frequency.value = filterFreq;
          filter.Q.value = q;

          const gain = ctx.createGain();
          const now = ctx.currentTime;
          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          src.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          src.start(now);
        }

        playSlash() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          // Crisp katana whoosh + metallic ring
          this.playNoise(0.14, 2400, 0.24, 1.8);

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(920, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.11);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.14);
        }

        playDash() {
          this.playNoise(0.18, 750, 0.16, 0.9);
        }

        playShurikenThrow() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(520, now + 0.08);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.095);
        }

        playShurikenClink() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(1950, now);
          osc.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.095);
        }

        playAlert() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.setValueAtTime(860, now + 0.06);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.19);
        }

        playSuspicious() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.linearRampToValueAtTime(490, now + 0.12);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        }

        playGunshot() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          this.playNoise(0.09, 1300, 0.2, 1.1);
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.09);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.11);
        }

        playPlayerHit() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(52, now + 0.22);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        }

        playUnlock() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const notes = [523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const now = ctx.currentTime + idx * 0.065;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.11, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
          });
        }

        playLaserHum(proximity) {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const nowMs = performance.now();
          if (nowMs - this.lastLaserHum < 260) return;
          this.lastLaserHum = nowMs;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(118, now);
          const vol = Math.max(0.01, Math.min(0.055, 0.055 * proximity));
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        }

        playVictory() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const now = ctx.currentTime + idx * 0.085;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.34);
          });

      // =========================================================================
      // PROCEDURAL ENDLESS LEVEL GENERATOR
      // =========================================================================
      function generateEndlessLevel(floor) {
        const cols = 24;
        const rows = 15;
        const grid = Array.from({ length: rows }, (_, r) =>
          Array.from({ length: cols }, (_, c) =>
            r === 0 || r === rows - 1 || c === 0 || c === cols - 1 ? "#" : "#"
          )
        );

        // Carve 5-6 connected rooms
        const rooms = [
          { x: 1, y: 1, w: 4, h: 4 },
          { x: 7, y: 1, w: 6, h: 5 },
          { x: 15, y: 1, w: 8, h: 5 },
          { x: 1, y: 7, w: 5, h: 7 },
          { x: 8, y: 8, w: 6, h: 6 },
          { x: 16, y: 8, w: 7, h: 6 }
        ];

        const carveRect = (x, y, w, h) => {
          for (let r = y; r < y + h; r++) {
            for (let c = x; c < x + w; c++) {
              if (r > 0 && r < rows - 1 && c > 0 && c < cols - 1) {
                grid[r][c] = ".";
              }
            }
          }
        };

        rooms.forEach((rm) => carveRect(rm.x, rm.y, rm.w, rm.h));

        // Carve wide 2-tile corridors & loops between rooms
        carveRect(4, 2, 4, 2);   // R0 <-> R1
        carveRect(12, 2, 4, 2);  // R1 <-> R2
        carveRect(2, 4, 2, 4);   // R0 <-> R3
        carveRect(5, 10, 4, 2);  // R3 <-> R4
        carveRect(13, 10, 4, 2); // R4 <-> R5
        carveRect(10, 5, 2, 4);  // R1 <-> R4
        carveRect(19, 5, 2, 4);  // R2 <-> R5

        // Add tactical cover pillars inside larger rooms
        const pillarSpots = [
          [9, 3], [11, 3],
          [18, 3], [20, 3],
          [3, 10],
          [10, 10], [12, 11],
          [19, 10], [21, 11]
        ];
        for (const [px, py] of pillarSpots) {
          if (Math.random() < 0.72) {
            grid[py][px] = "#";
          }
        }

        grid[2][2] = "P";
        grid[12][21] = "E";

        // Verify reachable floor tiles via BFS from (2,2)
        const walkable = [];
        const visited = new Set(["2,2"]);
        const queue = [[2, 2]];
        while (queue.length > 0) {
          const [cx, cy] = queue.shift();
          walkable.push([cx, cy]);
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = cx + dx;
            const ny = cy + dy;
            const key = `${nx},${ny}`;
            if (
              nx > 0 && nx < cols - 1 && ny > 0 && ny < rows - 1 &&
              grid[ny][nx] !== "#" && !visited.has(key)
            ) {
              visited.add(key);
              queue.push([nx, ny]);
            }
          }
        }

        // Pick enemy patrol pairs in rooms away from spawn
        const enemies = [];
        const enemyTargetCount = Math.min(9, 4 + Math.floor(floor * 0.9));
        const candidateRooms = rooms.slice(1);
        for (let i = 0; i < enemyTargetCount; i++) {
          const rm = candidateRooms[i % candidateRooms.length];
          const roomTiles = walkable.filter(
            ([tx, ty]) =>
              tx >= rm.x && tx < rm.x + rm.w &&
              ty >= rm.y && ty < rm.y + rm.h &&
              !(tx === 21 && ty === 12) &&
              Math.hypot(tx - 2, ty - 2) > 5.5
          );
          if (roomTiles.length >= 2) {
            let a = roomTiles[Math.floor(Math.random() * roomTiles.length)];
            let b = roomTiles[Math.floor(Math.random() * roomTiles.length)];
            for (let tries = 0; tries < 12; tries++) {
              const cand = roomTiles[Math.floor(Math.random() * roomTiles.length)];
              const steps = Math.max(2, Math.ceil(Math.hypot(cand[0] - a[0], cand[1] - a[1]) * 3));
              let blocked = false;
              for (let s = 0; s <= steps; s++) {
                const tx = Math.round(lerp(a[0], cand[0], s / steps));
                const ty = Math.round(lerp(a[1], cand[1], s / steps));
                if (grid[ty] && grid[ty][tx] === "#") {
                  blocked = true;
                  break;
                }
              }
              if (!blocked) {
                b = cand;
                break;
              }
            }
            let type = "guard";
            if (floor >= 2 && Math.random() < 0.35) type = "heavy";
            if (floor >= 3 && Math.random() < 0.3) type = "elite";
            enemies.push({
              type,
              waypoints: [[a[0] + 0.5, a[1] + 0.5], [b[0] + 0.5, b[1] + 0.5]],
              wait: 0.55
            });
          }
        }

        const cameras = [];
        if (floor >= 2) {
          cameras.push({
            x: 15.5,

      // =========================================================================
      // GEOMETRY, COLLISION & RAYCASTING HELPERS
      // =========================================================================
      function normalizeAngle(a) {
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
      }

      function angleDiff(a, b) {
        return normalizeAngle(b - a);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function raySegmentIntersect(ox, oy, dx, dy, x1, y1, x2, y2) {
        const sx = x2 - x1;
        const sy = y2 - y1;
        const denom = dx * sy - dy * sx;
        if (Math.abs(denom) < 1e-8) return null;
        const qpx = x1 - ox;
        const qpy = y1 - oy;
        const t = (qpx * sy - qpy * sx) / denom;
        const u = (qpx * dy - qpy * dx) / denom;
        if (t >= 0 && u >= 0 && u <= 1) {
          return t;
        }
        return null;
      }
